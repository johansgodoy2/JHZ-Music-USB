name: Build JHZ Music USB for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install yt-dlp pyinstaller

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpacked -Force

          $ffmpeg = Get-ChildItem ffmpeg-unpacked -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem ffmpeg-unpacked -Filter ffprobe.exe -Recurse | Select-Object -First 1

          New-Item -ItemType Directory -Force vendor | Out-Null
          Copy-Item $ffmpeg.FullName vendor/ffmpeg.exe
          Copy-Item $ffprobe.FullName vendor/ffprobe.exe

      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "JHZ Music USB" `
            --collect-all yt_dlp `
            --add-binary "vendor/ffmpeg.exe;." `
            --add-binary "vendor/ffprobe.exe;." `
            JHZ_Music_USB.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: JHZ-Music-USB-Windows
          path: "dist/JHZ Music USB.exe"
